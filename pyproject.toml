[project]
name = "three-fund-rebalance"
dynamic = ["version"]
description = "Interactive CLI that computes trades to rebalance a three-fund portfolio across multiple accounts."
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "scipy>=1.11",
    "pypdf>=4.0",
    "requests>=2.31",
]

[project.scripts]
three-fund-rebalance = "three_fund_rebalance.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
version = { attr = "three_fund_rebalance.__version__" }

[tool.setuptools.packages.find]
include = ["three_fund_rebalance*"]

[tool.ruff]
line-length = 100
target-version = "py310"

# Pinned explicitly rather than left to whatever the resolved ruff version
# enables by default. The default set has drifted before -- isort (I) and
# flake8-simplify (SIM) arrived in it without anyone choosing them -- which
# means a `ruff>=0.6` floor could change what CI accepts on an upgrade, in
# either direction. Naming the rules makes the lint reproducible.
#
# E is what turns line-length above from a decorative setting into an
# enforced one: E501 is not in ruff's default set, so the 100 was advisory
# and a handful of lines had quietly passed it.
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
